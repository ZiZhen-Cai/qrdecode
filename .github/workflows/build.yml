name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
            automake

      - name: Install buildozer
        run: pip install --upgrade buildozer cython
        
      - name: Prepare freetype cache (savannah 502 workaround)
        run: |
          D="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
          mkdir -p "$D"
          cd /tmp
          curl -sL -o ft.tar.gz "https://github.com/freetype/freetype/archive/refs/tags/VER-2-14-1.tar.gz"
          tar xzf ft.tar.gz
          mv freetype-VER-2-14-1 freetype-2.14.1
          tar czf "$D/freetype-2.14.1.tar.gz" freetype-2.14.1
          touch "$D/.mark-freetype-2.14.1.tar.gz"

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qrdecode-apk
          path: bin/*.apk
          if-no-files-found: error
