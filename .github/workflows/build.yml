name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool libtool-bin pkg-config gettext \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install buildozer
        run: pip install --upgrade buildozer cython

      - name: Download CJK font (fix Chinese rendering)
        run: |
          curl -fsSL -o NotoSansSC-Regular.otf \
            "https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf"
          ls -la NotoSansSC-Regular.otf

      - name: Pin python-for-android + downgrade SDL2 to tested 2.28.5
        run: |
          P4A="$GITHUB_WORKSPACE/.buildozer/android/platform/python-for-android"
          git clone --depth 1 https://github.com/kivy/python-for-android.git "$P4A"
          sed -i 's/2\.30\.11/2.28.5/g' "$P4A/pythonforandroid/recipes/sdl2/__init__.py"

      - name: Prepare freetype cache (savannah 502 + submodule + configure workaround)
        run: |
          D="$GITHUB_WORKSPACE/.buildozer/android/platform/build-arm64-v8a/packages/freetype"
          mkdir -p "$D"
          cd /tmp
          git clone --depth 1 -b VER-2-14-1 --recurse-submodules \
            https://github.com/freetype/freetype.git freetype-2.14.1
          cd freetype-2.14.1
          sh autogen.sh
          cd /tmp
          tar czf "$D/freetype-2.14.1.tar.gz" freetype-2.14.1
          touch "$D/.mark-freetype-2.14.1.tar.gz"

      - name: Build APK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: qrdecode-apk
          path: bin/*.apk
          if-no-files-found: error
